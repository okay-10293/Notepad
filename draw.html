<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="theme-color" content="#000000"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

button,select{background:var(--s);border:1px solid var(--bd);border-radius:8px;padding:6px 9px;cursor:pointer}

#top{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--bd);overflow-x:auto;white-space:nowrap}
#top a{color:var(--ink2);text-decoration:none;padding:6px 9px;border:1px solid var(--bd);border-radius:8px}

#stage{flex:1;position:relative;min-width:0;background:#2b2b2b}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

.bt{display:flex;gap:4px;flex-wrap:wrap}.bt button{flex:1;padding:6px 4px;font-size:12px;white-space:nowrap}

</style></head><body>

<div id="panel">

<div class="sec"><h4>브러시</h4>
<label class="r"><span>크기</span><input id="sz" type="range" min="1" max="200"></label>
<label class="r"><span>불투명</span><input id="op" type="range" min="1" max="100"></label>
<label class="r"><span>경도</span><input id="hd" type="range" min="0" max="100"></label>
<label class="r"><span>보정</span><input id="sb" type="range" min="0" max="90"></label>
<div class="chk"><label><input id="pr" type="checkbox" checked>필압</label><label><input id="sy" type="checkbox">대칭</label><label><input id="fd" type="checkbox">손가락 그리기</label><label><input id="fs" type="checkbox">도형 채움</label><label><input id="gd" type="checkbox">격자</label></div><div class="bt"><button id="s1">선택 해제</button><button id="s2">선택 지우기</button><button id="s3">오려내기</button></div></div>
<div class="sec"><h4>레이어</h4><div id="ll"></div>
<label class="r"><span>투명도</span><input id="lo" type="range" min="0" max="100"></label>
<select id="lb"><option value="source-over">일반</option><option value="multiply">곱하기</option><option value="screen">스크린</option><option value="overlay">오버레이</option><option value="darken">어둡게</option><option value="lighten">밝게</option><option value="soft-light">소프트라이트</option><option value="color-dodge">색상 닷지</option></select>
<div class="chk"><label><input id="lk" type="checkbox">알파 잠금</label><label><input id="lc" type="checkbox">아래로 클리핑</label></div>
<div class="bt"><button id="l1">추가</button><button id="l2">복제</button><button id="l3">병합↓</button><button id="l4">삭제</button></div>
<div class="bt"><button id="l5">위로</button><button id="l6">아래로</button><button id="l7">비우기</button><button id="l8">반전</button></div></div>
</div></main>
<div id="gal"><div style="display:flex;gap:8px;align-items:center;padding:10px 0;flex-wrap:wrap"><button id="gx">닫기</button><b>내 그림</b>

<script>
const $=id=>document.getElementById(id),mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c}

function toDoc(x,y){const c=Math.cos(-T.r),s=Math.sin(-T.r),dx=x-T.x,dy=y-T.y;return{x:(dx*c-dy*s)/T.s,y:(dx*s+dy*c)/T.s}}

layers.forEach((l,i)=>{if(!l.vis)return;vc.globalAlpha=l.op;vc.globalCompositeOperation=l.bl;const act=stroke&&i===cur;if(act&&stroke.tool==='move')vc.drawImage(l.c,stroke.dx||0,stroke.dy||0);else if(act||l.clip){tx.globalCompositeOperation='source-over';tx.globalAlpha=1;tx.clearRect(0,0,W,H);tx.drawImage(l.c,0,0);if(act)apply(tx,stroke);if(l.clip&&i>0){tx.globalCompositeOperation='destination-in';tx.drawImage(layers[i-1].c,0,0);tx.globalCompositeOperation='source-over'}vc.drawImage(tmp,0,0)}else vc.drawImage(l.c,0,0)});
vc.globalAlpha=1;vc.globalCompositeOperation='source-over';

const sp=lp||sel;if(sp){vc.beginPath();sp.forEach((p,i)=>i?vc.lineTo(p.x,p.y):vc.moveTo(p.x,p.y));if(!lp)vc.closePath();vc.lineWidth=2/T.s;vc.strokeStyle='#fff';vc.setLineDash([]);vc.stroke();vc.strokeStyle='#000';vc.setLineDash([6/T.s,6/T.s]);vc.stroke();vc.setLineDash([])}

let q=0;const rd=()=>{if(!q){q=1;requestAnimationFrame(()=>{q=0;render()})}}
/* 브러시 */
let dk=null,dkk=''
function dab(B,c){const k=B.size+'|'+B.hard+'|'+c;if(k===dkk)return dk;dkk=k;const s=Math.ceil(B.size)+2,cv=mk(s,s),x=cv.getContext('2d'),m=s/2;if(B.hard>=95){x.fillStyle=c;x.beginPath();x.arc(m,m,B.size/2,0,7);x.fill()}else{const g=x.createRadialGradient(m,m,0,m,m,B.size/2),[r,gg,b]=hexRgb(c);g.addColorStop(0,c);g.addColorStop(Math.max(B.hard/100,.01),c);g.addColorStop(1,`rgba(${r},${gg},${b},0)`);x.fillStyle=g;x.fillRect(0,0,s,s)}return dk=cv}
