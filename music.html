<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>오케이 음악</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/favicon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="오케이 음악" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#3d5a3e" />
  <style>
    :root {
      --bg: #f5f2eb; --surface: #fdfaf4; --ink: #1a1713; --ink-2: #6b6558;
      --ink-3: #a09890; --accent: #3d5a3e; --accent-light: #d4e6d4; --border: #e0dbd0;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14110d; --surface: #1d1a15; --ink: #f1ece2; --ink-2: #b5ad9e; --ink-3: #7d766a; --accent: #8fbf90; --accent-light: #28382a; --border: #2c2820; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    svg { display: block; flex-shrink: 0; }
    svg.fl { fill: currentColor; }
    svg.st { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      background: var(--bg); color: var(--ink); min-height: 100vh; min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    h1 { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; letter-spacing: -0.01em; }
    h1 svg { width: 22px; height: 22px; color: var(--accent); }
    .link { font-size: 0.82rem; color: var(--ink-2); text-decoration: none; border: 1px solid var(--border); border-radius: 999px; padding: 0.4rem 0.75rem; display: inline-flex; align-items: center; gap: 0.35rem; }
    .link svg { width: 14px; height: 14px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 1.1rem; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    #nowTitle { font-size: 1.05rem; font-weight: 600; word-break: break-all; min-height: 1.5em; }
    #nowSub { font-size: 0.78rem; color: var(--ink-3); margin-top: 0.15rem; }
    .seek { display: flex; align-items: center; gap: 0.6rem; margin: 0.9rem 0 0.4rem; font-size: 0.72rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    input[type=range] { flex: 1; accent-color: var(--accent); height: 28px; }
    .ctrl { display: flex; align-items: center; justify-content: center; gap: 0.6rem; }
    button { font-family: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--ink); border-radius: 999px; }
    .cbtn { width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); background: transparent; border-color: transparent; }
    .cbtn svg { width: 22px; height: 22px; }
    .cbtn:active { transform: scale(0.94); }
    .cbtn.main { width: 68px; height: 68px; background: var(--accent); color: var(--surface); border-color: var(--accent); box-shadow: 0 4px 14px rgba(61,90,62,0.28); }
    .cbtn.main svg { width: 30px; height: 30px; }
    .cbtn.on { background: var(--accent-light); color: var(--accent); }
    .add { display: flex; gap: 0.5rem; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .add label { background: var(--accent); color: var(--surface); border-radius: 999px; padding: 0.65rem 1.1rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.45rem; }
    .add label svg { width: 16px; height: 16px; stroke-width: 2.5; }
    .stat { font-size: 0.75rem; color: var(--ink-2); }
    ul { list-style: none; display: flex; flex-direction: column; }
    li { display: flex; align-items: center; gap: 0.5rem; padding: 0.7rem 0.4rem; border-bottom: 1px solid var(--border); }
    li:last-child { border-bottom: none; }
    li.cur { background: var(--accent-light); border-radius: 8px; }
    li .idx { width: 1.6rem; display: flex; justify-content: center; font-size: 0.78rem; color: var(--ink-3); flex-shrink: 0; }
    li.cur .idx { color: var(--accent); }
    li .idx svg { width: 16px; height: 16px; stroke-width: 3; }
    li .name { flex: 1; font-size: 0.9rem; word-break: break-all; cursor: pointer; }
    li .size { font-size: 0.7rem; color: var(--ink-3); flex-shrink: 0; }
    li .del { border-radius: 999px; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-3); background: transparent; border-color: transparent; flex-shrink: 0; }
    li .del svg { width: 16px; height: 16px; }
    .sync { font-size: 0.75rem; color: var(--ink-2); margin-top: 0.75rem; display: flex; align-items: center; gap: 0.35rem; word-break: break-all; }
    .sync:empty { display: none; }
    .sync svg { width: 14px; height: 14px; color: var(--accent); }
    .hint { display: none; margin-top: 0.75rem; font-size: 0.8rem; color: var(--accent); text-decoration: underline; line-height: 1.5; }
    .empty { text-align: center; color: var(--ink-3); font-size: 0.85rem; line-height: 1.7; padding: 1.5rem 0; }
    .badge { font-size: 0.72rem; padding: 0.25rem 0.6rem; border-radius: 999px; background: var(--border); color: var(--ink-2); display: inline-flex; align-items: center; gap: 0.25rem; }
    .badge svg { width: 12px; height: 12px; stroke-width: 3; }
    .badge.ok { background: var(--accent-light); color: var(--accent); }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span data-ic="music"></span>오케이 음악</h1>
    <div style="display:flex; gap:0.5rem; align-items:center;">
      <span class="badge" id="offBadge">오프라인 준비 중…</span>
      <a class="link" href="/"><span data-ic="back"></span>노트패드</a>
    </div>
  </header>

  <div class="card">
    <div id="nowTitle">재생 중인 곡 없음</div>
    <div id="nowSub"></div>
    <div class="seek">
      <span id="tCur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" />
      <span id="tDur">0:00</span>
    </div>
    <div class="ctrl">
      <button class="cbtn" id="btnShuffle" title="셔플" aria-label="셔플"></button>
      <button class="cbtn" id="btnPrev" title="이전" aria-label="이전"></button>
      <button class="cbtn main" id="btnPlay" title="재생/일시정지" aria-label="재생/일시정지"></button>
      <button class="cbtn" id="btnNext" title="다음" aria-label="다음"></button>
      <button class="cbtn" id="btnRepeat" title="반복" aria-label="반복"></button>
    </div>
  </div>

  <div class="card">
    <div class="add">
      <label>
        <span data-ic="plus"></span>곡 추가 (파일 앱에서 선택)
        <input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg" multiple style="display:none;" />
      </label>
      <span class="stat" id="stat"></span>
    </div>
    <div class="sync" id="sync"></div>
    <a class="hint" id="loginHint" href="/">로그인하면 모든 기기에서 같은 곡을 들을 수 있어요 (노트패드에서 로그인)</a>
  </div>

  <div class="card">
    <ul id="list"></ul>
  </div>
</div>

<audio id="audio" preload="auto" playsinline></audio>

<script>
(function () {
  'use strict'
  var $ = function (id) { return document.getElementById(id) }

  // ── SVG 아이콘 ──
  var ICONS = {
    music:   ['fl', '<path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>'],
    back:    ['st', '<path d="M19 12H5M12 19l-7-7 7-7"/>'],
    plus:    ['st', '<path d="M12 5v14M5 12h14"/>'],
    shuffle: ['st', '<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>'],
    prev:    ['fl', '<path d="M6 5h2v14H6zM20 5v14L9 12z"/>'],
    next:    ['fl', '<path d="M16 5h2v14h-2zM4 5v14l11-7z"/>'],
    play:    ['fl', '<path d="M7 4.5v15l13-7.5z"/>'],
    pause:   ['fl', '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>'],
    repeat:  ['st', '<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>'],
    repeat1: ['st', '<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/><path d="M11 10h1.5v4"/>'],
    edit:    ['st', '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'],
    close:   ['st', '<path d="M18 6 6 18M6 6l12 12"/>'],
    eq:      ['st', '<path d="M5 20V10M12 20V4M19 20v-7"/>'],
    check:   ['st', '<path d="M20 6 9 17l-5-5"/>'],
    cloud:   ['st', '<path d="M18 10a6 6 0 0 0-11.6-2A4.5 4.5 0 0 0 7 17h11a3.5 3.5 0 0 0 0-7z"/>']
  }
  function ic(n) { var d = ICONS[n]; return '<svg viewBox="0 0 24 24" class="' + d[0] + '" aria-hidden="true">' + d[1] + '</svg>' }
  document.querySelectorAll('[data-ic]').forEach(function (el) { el.innerHTML = ic(el.getAttribute('data-ic')) })
  $('btnShuffle').innerHTML = ic('shuffle')
  $('btnPrev').innerHTML = ic('prev')
  $('btnPlay').innerHTML = ic('play')
  $('btnNext').innerHTML = ic('next')
  $('btnRepeat').innerHTML = ic('repeat')
  var audio = $('audio')
  var tracks = []          // { id, name, size, blob }
  var cur = -1             // 현재 재생 인덱스
  var shuffle = false
  var repeat = 'all'       // 'off' | 'all' | 'one'
  var objUrl = null
  var db = null

  // ── IndexedDB ──
  function openDB() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open('okay-music', 1)
      r.onupgradeneeded = function () { r.result.createObjectStore('tracks', { keyPath: 'id', autoIncrement: true }) }
      r.onsuccess = function () { res(r.result) }
      r.onerror = function () { rej(r.error) }
    })
  }
  function tx(mode, fn) {
    return new Promise(function (res, rej) {
      var t = db.transaction('tracks', mode)
      var out = fn(t.objectStore('tracks'))
      t.oncomplete = function () { res(out && out.result) }
      t.onerror = function () { rej(t.error) }
      t.onabort = function () { rej(t.error || new Error('저장 실패 (용량 부족일 수 있어요)')) }
    })
  }
  function loadAll() {
    return tx('readonly', function (s) { return s.getAll() }).then(function (rows) { tracks = rows || [] })
  }

  // ── 유틸 ──
  function fmt(s) {
    if (!isFinite(s)) return '0:00'
    s = Math.floor(s); var m = Math.floor(s / 60), x = s % 60
    return m + ':' + (x < 10 ? '0' : '') + x
  }
  function mb(n) { return (n / 1048576).toFixed(1) + 'MB' }
  function clean(name) { return name.replace(/\.[^.]+$/, '') }
  // 표시 이름: 직접 바꾼 이름(title)이 있으면 그걸, 없으면 파일명(확장자 제외)
  // 바꾼 이름은 곡 파일(blob)과 분리해서 localStorage에 저장 (blob을 다시 쓰면 iOS 사파리에서 파일이 깨질 수 있음)
  var TITLES_KEY = 'okay-music-titles'
  var titles = {}
  try { titles = JSON.parse(localStorage.getItem(TITLES_KEY) || '{}') || {} } catch (e) { titles = {} }
  function saveTitles() { try { localStorage.setItem(TITLES_KEY, JSON.stringify(titles)) } catch (e) {} }
  function label(t) { return titles[t.id] || t.title || clean(t.name) }

  // ── 목록 렌더 ──
  function render() {
    var ul = $('list')
    ul.innerHTML = ''
    if (!tracks.length) {
      ul.innerHTML = '<div class="empty">아직 곡이 없어요.<br>위의 <b>곡 추가</b>로 파일 앱에 있는 mp3를 골라주세요.<br>한 번 추가하면 와이파이 없이도 재생돼요.</div>'
    }
    tracks.forEach(function (t, i) {
      var li = document.createElement('li')
      if (i === cur) li.className = 'cur'
      li.innerHTML = '<span class="idx">' + (i === cur && !audio.paused ? ic('eq') : (i + 1)) + '</span>' +
        '<span class="name"></span><span class="size">' + mb(t.size) + '</span>' +
        '<button class="del ren" title="이름 수정" aria-label="이름 수정">' + ic('edit') + '</button>' +
        '<button class="del" title="삭제" aria-label="삭제">' + ic('close') + '</button>'
      li.querySelector('.name').textContent = label(t)
      li.querySelector('.name').onclick = function () { play(i) }
      li.querySelector('.ren').onclick = function () { renameTrack(i) }
      li.querySelectorAll('.del')[1].onclick = function () { removeTrack(i) }
      ul.appendChild(li)
    })
    var total = tracks.reduce(function (a, t) { return a + t.size }, 0)
    $('stat').textContent = tracks.length ? (tracks.length + '곡 · ' + mb(total)) : ''
  }

  function updateNow() {
    var t = tracks[cur]
    $('nowTitle').textContent = t ? label(t) : '재생 중인 곡 없음'
    $('nowSub').textContent = t ? ((cur + 1) + ' / ' + tracks.length) : ''
    $('btnPlay').innerHTML = ic(audio.paused ? 'play' : 'pause')
    document.title = t ? (label(t) + ' · 오케이 음악') : '오케이 음악'
    if ('mediaSession' in navigator && t) {
      try { navigator.mediaSession.metadata = new MediaMetadata({ title: label(t), artist: '오케이 음악' }) } catch (e) {}
    }
  }

  // ── 재생 제어 ──
  function play(i) {
    if (i < 0 || i >= tracks.length) return
    cur = i
    if (objUrl) URL.revokeObjectURL(objUrl)
    objUrl = URL.createObjectURL(tracks[i].blob)
    audio.src = objUrl
    audio.loop = (repeat === 'one')
    var p = audio.play()
    if (p && p.catch) p.catch(function () { updateNow() })
    updateNow(); render()
  }
  function nextIndex(auto) {
    if (!tracks.length) return -1
    if (shuffle && tracks.length > 1) {
      var n; do { n = Math.floor(Math.random() * tracks.length) } while (n === cur)
      return n
    }
    var n2 = cur + 1
    if (n2 >= tracks.length) {
      if (repeat === 'all' || !auto) return 0
      return -1  // 반복 끔 + 마지막 곡 끝 → 정지
    }
    return n2
  }
  function next(auto) {
    var n = nextIndex(auto)
    if (n === -1) { audio.pause(); audio.currentTime = 0; updateNow(); render(); return }
    play(n)
  }
  function prev() {
    if (audio.currentTime > 3) { audio.currentTime = 0; return }
    if (!tracks.length) return
    play(cur <= 0 ? tracks.length - 1 : cur - 1)
  }
  function toggle() {
    if (cur === -1) { if (tracks.length) play(0); return }
    if (audio.paused) audio.play(); else audio.pause()
  }

  audio.addEventListener('ended', function () { next(true) })
  audio.addEventListener('play', function () { updateNow(); render() })
  audio.addEventListener('pause', function () { updateNow(); render() })
  audio.addEventListener('timeupdate', function () {
    if (audio.duration) $('seek').value = Math.round(audio.currentTime / audio.duration * 1000)
    $('tCur').textContent = fmt(audio.currentTime)
    $('tDur').textContent = fmt(audio.duration)
  })
  // 깨진 파일은 건너뛰되, 전부 깨졌을 때 무한 반복되지 않게 연속 오류 횟수 제한
  var errStreak = 0
  audio.addEventListener('error', function () {
    if (cur === -1) return
    errStreak++
    if (errStreak >= tracks.length) { errStreak = 0; alert('재생할 수 없는 파일이에요. 삭제 후 다시 추가해주세요.'); return }
    next(true)
  })
  audio.addEventListener('playing', function () { errStreak = 0 })

  $('seek').addEventListener('input', function () {
    if (audio.duration) audio.currentTime = $('seek').value / 1000 * audio.duration
  })
  $('btnPlay').onclick = toggle
  $('btnNext').onclick = function () { next(false) }
  $('btnPrev').onclick = prev
  $('btnShuffle').onclick = function () {
    shuffle = !shuffle
    this.classList.toggle('on', shuffle)
  }
  $('btnRepeat').onclick = function () {
    repeat = repeat === 'all' ? 'one' : repeat === 'one' ? 'off' : 'all'
    audio.loop = (repeat === 'one')
    this.innerHTML = ic(repeat === 'one' ? 'repeat1' : 'repeat')
    this.classList.toggle('on', repeat !== 'off')
    this.title = repeat === 'all' ? '전체 반복' : repeat === 'one' ? '한 곡 반복' : '반복 끔'
  }
  $('btnRepeat').classList.add('on')

  if ('mediaSession' in navigator) {
    var ms = navigator.mediaSession
    try {
      ms.setActionHandler('play', function () { audio.play() })
      ms.setActionHandler('pause', function () { audio.pause() })
      ms.setActionHandler('previoustrack', prev)
      ms.setActionHandler('nexttrack', function () { next(false) })
    } catch (e) {}
  }

  // ── 곡 추가/삭제 ──
  $('fileInput').addEventListener('change', function (e) {
    var files = Array.prototype.slice.call(e.target.files || [])
    e.target.value = ''
    if (!files.length) return
    files.sort(function (a, b) { return a.name.localeCompare(b.name, 'ko', { numeric: true }) })
    $('stat').textContent = '저장 중…'
    var chain = Promise.resolve()
    files.forEach(function (f) {
      chain = chain.then(function () {
        return tx('readwrite', function (s) { return s.add({ name: f.name, size: f.size, blob: f }) })
      })
    })
    chain.then(loadAll).then(function () {
      render(); updateNow()
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist()
      runSync()
    }).catch(function (err) {
      alert('저장 실패: ' + (err && err.message ? err.message : err))
      loadAll().then(render)
    })
  })

  function renameTrack(i) {
    var t = tracks[i]
    if (!t) return
    var v = prompt('곡 이름 수정 (비우면 원래 파일명으로 돌아가요)', label(t))
    if (v === null) return
    v = v.trim()
    if (v) titles[t.id] = v; else delete titles[t.id]
    saveTitles()
    setDirty(true); pushTitles()
    render(); updateNow()
  }

  function removeTrack(i) {
    var t = tracks[i]
    if (!t || !confirm('"' + label(t) + '" 삭제할까요?')) return
    var rid = remoteMap[t.id]
    if (rid) { pending.push(rid); savePending(); delete remoteMap[t.id]; saveMap() }
    tx('readwrite', function (s) { return s.delete(t.id) }).then(loadAll).then(function () {
      delete titles[t.id]; saveTitles()
      flushPending()
      if (i === cur) { audio.pause(); audio.removeAttribute('src'); cur = -1 }
      else if (i < cur) cur--
      render(); updateNow()
    })
  }

  // ── 오프라인(PWA) ──
  function setBadge(ok) {
    var b = $('offBadge')
    b.innerHTML = ok ? ic('check') + '오프라인 가능' : '오프라인 준비 안 됨'
    b.className = 'badge' + (ok ? ' ok' : '')
  }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').then(function () { return navigator.serviceWorker.ready })
      .then(function () {
        return caches.match('/music.html').then(function (r) { setBadge(!!r) })
      }).catch(function () { setBadge(false) })
  } else {
    setBadge(false)
  }

  // ── 계정 동기화 (Supabase Storage) ──
  // 곡은 노트패드가 이미 쓰는 'images' 버킷의 <내 uid>/music/ 폴더에 올린다.
  // 이 기기에도 항상 IndexedDB에 사본을 두기 때문에 오프라인(비행기)에서는 기존처럼 로컬 곡만으로 재생된다.
  var SB_URL = 'https://iksctrteeygnvfcsyjea.supabase.co'
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlrc2N0cnRlZXlnbnZmY3N5amVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTExMTMsImV4cCI6MjA5NjE2NzExM30.DcsqSXHE4tu_B_vNX9UhGIYAt9CyMvNj3gzRS7T45hg'
  var BUCKET = 'images'
  var MAX_BYTES = 50 * 1048576
  var MIME = { mp3: 'audio/mpeg', m4a: 'audio/mp4', aac: 'audio/aac', wav: 'audio/wav', flac: 'audio/flac', ogg: 'audio/ogg' }
  var MAP_KEY = 'okay-music-remote', UID_KEY = 'okay-music-uid', PEND_KEY = 'okay-music-pending-del', DIRTY_KEY = 'okay-music-titles-dirty'
  function lsGet(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d } catch (e) { return d } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} }
  var remoteMap = lsGet(MAP_KEY, {})   // 로컬 곡 id → 서버 파일명(rid)
  var pending = lsGet(PEND_KEY, [])    // 아직 서버에서 못 지운 곡
  function saveMap() { lsSet(MAP_KEY, remoteMap) }
  function savePending() { lsSet(PEND_KEY, pending) }
  function setDirty(v) { lsSet(DIRTY_KEY, !!v) }
  var sb = null, uid = null, syncing = false

  function setSync(msg, ok) {
    var el = $('sync')
    el.innerHTML = (ok ? ic('cloud') : '') + '<span></span>'
    el.lastChild.textContent = msg || ''
    if (!msg) el.innerHTML = ''
  }
  function b64(str) {
    var bytes = new TextEncoder().encode(str), bin = ''
    bytes.forEach(function (b) { bin += String.fromCharCode(b) })
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
  }
  function unb64(seg) {
    try {
      var x = seg.replace(/-/g, '+').replace(/_/g, '/'); while (x.length % 4) x += '='
      var bin = atob(x), u = new Uint8Array(bin.length)
      for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i)
      return new TextDecoder('utf-8').decode(u)
    } catch (e) { return null }
  }
  // 서버 파일명: <시간>-<난수>.<원래이름(base64url)>.<확장자>  (한글 이름도 안전하게)
  function makeRid(name) {
    var m = name.match(/\.([a-zA-Z0-9]{1,5})$/), ext = m ? m[1].toLowerCase() : 'mp3'
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6) + '.' + b64(name) + '.' + ext
  }
  function ridName(rid) {
    var parts = rid.split('.'); var ext = parts.pop(); var seg = parts.pop()
    return { name: (seg && unb64(seg)) || rid, ext: ext }
  }
  function loadSbLib() {
    return new Promise(function (res, rej) {
      if (window.supabase) return res()
      var sc = document.createElement('script')
      sc.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'
      sc.onload = function () { res() }
      sc.onerror = function () { rej(new Error('lib')) }
      document.head.appendChild(sc)
    })
  }
  function curId() { return tracks[cur] ? tracks[cur].id : null }
  function fixCur(id) {
    var idx = -1
    tracks.forEach(function (t, i) { if (t.id === id) idx = i })
    if (idx === -1 && cur !== -1) { audio.pause(); audio.removeAttribute('src'); idx = -1 }
    cur = idx
  }

  function initSync() {
    if (!navigator.onLine) { setSync('오프라인 · 이 기기에 저장된 곡으로 재생해요'); return Promise.resolve() }
    return loadSbLib().then(function () {
      sb = window.supabase.createClient(SB_URL, SB_KEY)
      return sb.auth.getSession()
    }).then(function (r) {
      var sess = r && r.data && r.data.session
      if (!sess) { $('loginHint').style.display = 'block'; setSync(''); return }
      $('loginHint').style.display = 'none'
      uid = sess.user.id
      return runSync()
    }).catch(function () { setSync('동기화 연결 실패 · 이 기기의 곡으로 재생해요') })
  }

  function flushPending() {
    if (!sb || !uid || !pending.length) return Promise.resolve()
    var list = pending.slice()
    return sb.storage.from(BUCKET).remove(list.map(function (r) { return uid + '/music/' + r })).then(function (res) {
      if (!res.error) { pending = pending.filter(function (r) { return list.indexOf(r) === -1 }); savePending() }
    }).catch(function () {})
  }

  function wipeSynced() {
    var ids = Object.keys(remoteMap).map(Number)
    remoteMap = {}; saveMap(); pending = []; savePending(); setDirty(false)
    return ids.reduce(function (p, id) { return p.then(function () { delete titles[id]; return tx('readwrite', function (s) { return s.delete(id) }) }) }, Promise.resolve())
      .then(function () { saveTitles(); return loadAll() })
  }

  function pushTitles() {
    if (!sb || !uid || !navigator.onLine) return Promise.resolve()
    var obj = {}
    tracks.forEach(function (t) { var r = remoteMap[t.id]; if (r && titles[t.id]) obj[r] = titles[t.id] })
    var blob = new Blob([JSON.stringify(obj)], { type: 'application/json' })
    return sb.storage.from(BUCKET).upload(uid + '/music/titles.json', blob, { upsert: true, contentType: 'application/json' })
      .then(function (r) { if (!r.error) setDirty(false) }).catch(function () {})
  }

  async function runSync() {
    if (syncing || !sb || !uid || !navigator.onLine) return
    syncing = true
    var up = 0, down = 0, gone = 0, failed = 0, lastErr = ''
    try {
      var last = localStorage.getItem(UID_KEY)
      if (last && last !== uid) { var id0 = curId(); await wipeSynced(); fixCur(id0) }   // 다른 계정이면 이전 계정의 동기화 곡은 이 기기에서 치움
      try { localStorage.setItem(UID_KEY, uid) } catch (e) {}
      var bk = sb.storage.from(BUCKET), prefix = uid + '/music'
      setSync('동기화 중…', true)
      await flushPending()
      var lr = await bk.list(prefix, { limit: 1000 })
      if (lr.error) throw lr.error
      var remote = {}
      ;(lr.data || []).forEach(function (o) { if (o.name !== 'titles.json' && pending.indexOf(o.name) === -1) remote[o.name] = o })

      // 1) 다른 기기에서 지운 곡 → 이 기기에서도 삭제
      var idBefore = curId(), toRemove = []
      tracks.forEach(function (t) { var r = remoteMap[t.id]; if (r && !remote[r]) toRemove.push(t) })
      for (var a = 0; a < toRemove.length; a++) {
        var t0 = toRemove[a]
        await tx('readwrite', function (s) { return s.delete(t0.id) })
        delete remoteMap[t0.id]; delete titles[t0.id]; gone++
      }
      if (toRemove.length) { saveMap(); saveTitles(); await loadAll(); fixCur(idBefore); render(); updateNow() }

      // 2) 이 기기에만 있는 곡 → 서버에 올리기
      var have = {}
      tracks.forEach(function (t) { if (remoteMap[t.id]) have[remoteMap[t.id]] = true })
      var local = tracks.slice()
      for (var b = 0; b < local.length; b++) {
        var t = local[b]
        if (remoteMap[t.id]) continue
        if (t.size > MAX_BYTES) { failed++; lastErr = '50MB가 넘는 곡은 올릴 수 없어요'; continue }
        setSync('올리는 중 (' + (b + 1) + '/' + local.length + ')', true)
        var rid = makeRid(t.name)
        var ext = rid.split('.').pop()
        var ur = await bk.upload(prefix + '/' + rid, t.blob, { contentType: MIME[ext] || 'audio/mpeg', upsert: false })
        if (ur.error) { failed++; lastErr = ur.error.message; continue }
        remoteMap[t.id] = rid; saveMap(); have[rid] = true; up++
      }

      // 3) 서버에만 있는 곡 → 이 기기로 내려받기 (이름순 = 올린 순서)
      var need = Object.keys(remote).sort().filter(function (r) { return !have[r] })
      for (var c = 0; c < need.length; c++) {
        setSync('내려받는 중 (' + (c + 1) + '/' + need.length + ')', true)
        var dl = await bk.download(prefix + '/' + need[c])
        if (dl.error || !dl.data) { failed++; lastErr = (dl.error && dl.error.message) || '다운로드 실패'; continue }
        var info = ridName(need[c])
        var blob = new Blob([dl.data], { type: MIME[info.ext] || 'audio/mpeg' })
        var newId = await tx('readwrite', function (s) { return s.add({ name: info.name, size: blob.size, blob: blob }) })
        remoteMap[newId] = need[c]; saveMap(); down++
      }

      // 4) 곡 이름(수정한 제목) 맞추기
      var rt = {}
      try {
        var tr = await bk.download(prefix + '/titles.json')
        if (!tr.error && tr.data) rt = JSON.parse(await tr.data.text()) || {}
      } catch (e) { rt = {} }
      await loadAll()
      var dirty = lsGet(DIRTY_KEY, false)
      if (!dirty) {
        tracks.forEach(function (t) {
          var r = remoteMap[t.id]; if (!r) return
          if (rt[r]) titles[t.id] = rt[r]; else delete titles[t.id]
        })
        saveTitles()
      } else { await pushTitles() }

      fixCur(idBefore)
      render(); updateNow()
      if (failed) setSync('일부 곡을 못 올렸어요 (' + failed + '곡): ' + lastErr)
      else setSync('동기화됨 · ' + tracks.length + '곡' + ((up || down || gone) ? ' (올림 ' + up + ' / 받음 ' + down + ' / 삭제 ' + gone + ')' : ''), true)
    } catch (e) {
      setSync('동기화 실패: ' + (e && e.message ? e.message : e))
    } finally { syncing = false }
  }
  window.addEventListener('online', function () { if (sb && uid) runSync(); else initSync() })

  // ── 시작 ──
  openDB().then(function (d) { db = d; return loadAll() }).then(function () { render(); updateNow(); initSync() })
    .catch(function (e) {
      $('list').innerHTML = '<div class="empty">이 브라우저에서는 곡을 저장할 수 없어요.<br>(' + (e && e.message ? e.message : e) + ')</div>'
    })
})()
</script>
