<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>오케이 테이블</title>
  <meta name="description" content="오케이 테이블 — 노트패드, PDF, 드로잉, 음악." />
  <meta property="og:title" content="오케이 테이블" />
  <meta property="og:description" content="노트패드, PDF, 드로잉, 음악." />
  <meta property="og:image" content="/assets/og-image.png" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/favicon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="오케이 테이블" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg: #ffffff; --surface: #ffffff; --ink: #0a0a0a; --ink-2: #5c5c5c; --ink-3: #9b9b9b; --accent: #0a0a0a; --accent-light: #f1f1f1; --border: #e6e6e6; --on-accent: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000000; --surface: #121212; --ink: #f5f5f5; --ink-2: #a8a8a8; --ink-3: #6e6e6e; --accent: #f5f5f5; --accent-light: #232323; --border: #2a2a2a; --on-accent: #0a0a0a; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    body { background: var(--bg); color: var(--ink); font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 4rem 1.25rem 2rem; }
    .brand { font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-size: 2.2rem; font-weight: 700; letter-spacing: -0.03em; }
    .tag { margin-top: 0.5rem; color: var(--ink-2); font-size: 0.95rem; line-height: 1.6; }
    .grid { margin-top: 2.5rem; display: grid; gap: 0.9rem; }
    .tile { display: flex; align-items: center; gap: 1rem; padding: 1.25rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: inherit; text-decoration: none; transition: transform 0.12s, border-color 0.12s; }
    .tile:active { transform: scale(0.985); }
    .tile:hover { border-color: var(--accent); }
    .ico { width: 54px; height: 54px; border-radius: 8px; background: var(--accent-light); color: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
    .ico svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .txt { flex: 1; min-width: 0; }
    .name { font-size: 1.08rem; font-weight: 700; }
    .desc { margin-top: 0.2rem; font-size: 0.85rem; color: var(--ink-2); line-height: 1.5; }
    .chev { width: 20px; height: 20px; color: var(--ink-3); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .note { display: none; margin-top: 0.4rem; font-size: 0.75rem; color: var(--ink-3); }
    .tile.soon { opacity: 0.55; cursor: default; }
    .tile.soon:hover { border-color: var(--border); }
    .off .tile.needs-net { opacity: 0.55; }
    .off .tile.needs-net .desc::after { content: " · 인터넷 필요"; }
    .off-msg { display: none; margin-top: 1.25rem; font-size: 0.82rem; color: var(--ink-2); }
    .off .off-msg { display: block; }
    footer { padding: 1.5rem 1.25rem 2rem; text-align: center; font-size: 0.75rem; color: var(--ink-3); }
    footer a { color: var(--ink-3); text-decoration: none; margin: 0 0.5rem; }
  </style>
</head>
<body>
  <main id="root">
    <h1 class="brand">오케이 테이블</h1>
    <p class="tag">노트패드, PDF, 드로잉, 음악. 같은 계정으로 모든 기기에서 사용합니다.</p>

    <div class="off-msg">오프라인 상태입니다. 음악은 이 기기에 저장된 곡만 재생됩니다.</div>

    <div class="grid">
      <a class="tile needs-net" href="/notepad.html">
        <span class="txt"><div class="name">노트패드</div><div class="desc">글, 파일 저장</div></span>
      </a>
      <a class="tile" href="/pdf.html">
        <span class="txt"><div class="name">PDF 오프너</div><div class="desc">PDF 열기, 필기</div></span>
      </a>
      <a class="tile" href="/draw.html">
        <span class="txt"><div class="name">드로잉</div><div class="desc">그림 그리기</div></span>
      </a>
      <a class="tile" href="/music.html">
        <span class="txt"><div class="name">음악</div><div class="desc">저장한 곡 재생</div></span>
      </a>
    </div>
  </main>

  <footer>
    <a href="/privacy.html">개인정보처리방침</a>
    <a href="/terms.html">이용약관</a>
  </footer>

  <script>
    (function () {
      function upd() { document.getElementById('root').classList.toggle('off', !navigator.onLine) }
      upd(); window.addEventListener('online', upd); window.addEventListener('offline', upd)
      if ('serviceWorker' in navigator) {
        try { navigator.serviceWorker.register('/sw.js').catch(function () {}) } catch (e) {}
      }
    })()
  </script>
</body>
</html>
